# Il backend: Spring Boot, porta 8080.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gestionale
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: gestionale
spec:
  # ⚠️ Una replica, e non e' pigrizia.
  #
  # Flyway gira all'avvio di ogni pod. Con due repliche che partono insieme su
  # un database non ancora migrato, entrambe provano ad applicare le stesse
  # migrazioni: Flyway si difende con un lock sulla tabella di storia, quindi
  # la seconda aspetta invece di corrompere lo schema — ma resta un avvio in
  # cui una delle due puo' andare in timeout.
  #
  # C'e' una seconda ragione, piu' seria: la sessione utente vive **nella
  # memoria del pod** (HttpSessionSecurityContextRepository, nessun Redis).
  # Con due repliche e un bilanciamento round-robin, una richiesta su due
  # arriva al pod che non conosce quella sessione e l'utente viene buttato
  # fuori. Per scalare servirebbero le sessioni condivise, non solo
  # `replicas: 2`.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          # ⚠️ SOSTITUISCI con la tua immagine. Il Dockerfile e' in backend/,
          # fa il build con Maven e produce un jar eseguibile su JRE 25.
          #
          # Un tag preciso e non `latest`: con `latest` e
          # `imagePullPolicy: Always` non si sa quale versione sta girando, e
          # un rollback non ha niente a cui tornare.
          image: CAMBIAMI/gestionale-backend:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-credenziali

          # Le probe sono su HTTP, e prima non potevano esserlo: il progetto
          # non aveva Actuator, e nessuna rotta era utilizzabile al suo posto
          # perche' ogni `/api/**` pretende l'autenticazione e risponde 401,
          # che una probe legge come un guasto. Si ripiegava sul TCP, che dice
          # soltanto «la porta e' aperta» — e non si accorge di un backend
          # vivo che non raggiunge piu' il database.
          #
          # Ora `/actuator/health` c'e' ed e' permitAll in
          # ConfigurazioneSicurezza, con `show-details=never`: la risposta e'
          # `{"status":"UP"}` e niente altro, quindi aprirla non racconta a
          # nessuno quale database si usa o che cosa non funziona.
          #
          # readiness e liveness puntano a due gruppi diversi e non allo
          # stesso indirizzo: readiness comprende il controllo sul datasource,
          # liveness no. E' voluto — un database irraggiungibile deve togliere
          # il pod dal traffico, non farlo riavviare in ciclo: riavviarlo non
          # rimette in piedi il database.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            # Flyway applica tutte le migrazioni al primo avvio: la finestra e'
            # larga di proposito. Finche' la startupProbe non passa, le altre
            # due non vengono valutate, quindi un avvio lento non conta come
            # un guasto.
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20

          resources:
            requests:
              cpu: 250m
              # La JVM non e' avara: sotto questa soglia il pod viene ucciso
              # dall'OOM killer durante il build del contesto di Spring.
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Lo stesso utente che il Dockerfile dichiara ormai con USER:
            # l'immagine e' gia' a posto da se', e queste righe restano come
            # conferma esplicita invece che come correzione. Prima erano una
            # correzione, perche' il Dockerfile non diceva niente e l'immagine
            # girava come root.
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gestionale
spec:
  # ClusterIP: il backend non si espone fuori dal cluster. Chi lo raggiunge e'
  # nginx del frontend, che sta nello stesso spazio dei nomi e lo trova come
  # `http://backend:8080`.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
