# La configurazione di nginx per il frontend, DENTRO l'immagine.
#
# Prima viveva solo in k8s/20-frontend-config.yaml, montata come ConfigMap.
# Significava che l'immagine, da sola, era rotta in due modi — e nessuno dei
# due si vede subito:
#
# 1. **Niente proxy per /api.** In sviluppo le chiamate a `/api` le inoltra il
#    proxy di Vite (`vite.config.ts`), ma quel proxy vive solo nel server di
#    sviluppo: nel container non esiste, e ogni chiamata all'API rispondeva
#    404 da nginx.
# 2. **Niente ripiego sull'indice.** L'applicazione usa `BrowserRouter`,
#    quindi `/lavori/2` è una rotta del browser e non un file su disco. Con la
#    configurazione predefinita, aprire quell'indirizzo o premere F5 su quella
#    pagina dava 404: funzionava solo la radice. È il difetto più facile da
#    non notare, perché navigando dentro l'applicazione non si manifesta mai.
#
# Stando qui, l'immagine funziona ovunque la si avvii — docker compose, docker
# run, Kubernetes — e la ConfigMap resta disponibile per chi debba cambiare
# qualcosa senza ricostruirla, perché montata su questo stesso percorso la
# sostituisce.

# Lo schema originale della richiesta, per il backend.
#
# Se davanti c'è qualcosa che termina il TLS (un Ingress, un reverse proxy
# aziendale), l'informazione «era HTTPS» arriva solo nell'header: `$scheme`
# qui dentro vale `http`, perché fra quel qualcosa e nginx si parla in chiaro.
# Questa mappa inoltra l'header quando c'è e ripiega sullo schema reale quando
# non c'è — il caso di chi raggiunge direttamente questo container.
#
# Al backend serve perché application-prod.properties attiva
# `server.forward-headers-strategy=framework`.
map $http_x_forwarded_proto $proto_originale {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nessuna versione di nginx nelle intestazioni e nelle pagine d'errore:
    # non impedisce niente a nessuno, ma non c'è motivo di annunciare quale
    # versione si sta usando a chi cerca quelle con una falla nota.
    server_tokens off;

    # --- Intestazioni di sicurezza ------------------------------------------
    #
    # `always` su tutte: senza, nginx le aggiunge solo alle risposte 2xx e 3xx,
    # e una pagina d'errore uscirebbe senza protezioni.
    #
    # Quello che NON c'è, e perché: `Strict-Transport-Security`. Dice al
    # browser di non parlare mai più in chiaro con questo nome, e si ricorda
    # per mesi. Su un server interno raggiunto in HTTP è il modo di rendersi
    # irraggiungibili da ogni postazione che abbia aperto la pagina una volta,
    # e non si disfa cancellando la riga. Va aggiunto quando c'è HTTPS, e
    # preferibilmente là dove il TLS viene terminato.

    # Il browser non deve indovinare il tipo di un file: un .json che sembra
    # HTML non va eseguito come HTML.
    add_header X-Content-Type-Options "nosniff" always;

    # Fuori dall'azienda non deve uscire l'indirizzo completo della pagina da
    # cui si arriva: /lavori/2 dice che esiste il lavoro 2.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Il gestionale non va messo dentro il frame di nessuno. È la difesa dal
    # clickjacking, e insieme a `frame-ancestors` qui sotto copre anche i
    # browser che leggono solo questo.
    add_header X-Frame-Options "DENY" always;

    # La Content-Security-Policy. Ogni voce corrisponde a qualcosa che
    # l'applicazione fa davvero:
    #
    #   script-src 'self'        Vite produce file .js, nessuno script inline
    #   style-src  'unsafe-inline'  serve DAVVERO: FullCalendar posiziona gli
    #                            eventi scrivendo l'attributo style, e senza
    #                            questo il calendario si disegna sbagliato
    #   style-src/font-src  i domini di Google Fonts, da cui index.html
    #                            carica Figtree. Autoospitando il carattere,
    #                            queste due eccezioni spariscono
    #   connect-src 'self'       le chiamate vanno a /api, stessa origine
    #   img-src data:            le icone SVG inline
    #   frame-ancestors 'none'   come X-Frame-Options
    #   form-action 'self'       un form non può inviare altrove
    #   base-uri 'self'          nessuno può riscrivere la base dei link
    #   object-src 'none'        niente plugin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # --- Le chiamate all'API -------------------------------------------------
    #
    # Il nome `backend` deve coincidere con quello del servizio: vale sia per
    # il Service di 11-backend.yaml sia per il servizio del compose, che si
    # chiamano entrambi così apposta.
    #
    # Passando da qui il browser vede tutto sulla stessa origine, ed è
    # necessario e non comodo: il cookie di sessione è `SameSite=Strict` — lo
    # dice ConfigurazioneSicurezza, ed è la ragione per cui il CSRF è
    # disattivato — quindi su un'origine diversa il browser non lo allegherebbe
    # e nessuno riuscirebbe ad autenticarsi.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_originale;
        proxy_set_header X-Forwarded-Host  $host;

        # Il backend applica le migrazioni al primo avvio e può tardare a
        # rispondere: il minuto predefinito di nginx basta, ma dichiararlo
        # evita di scoprire un 504 durante un rilascio.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Cache, e perché qui non si usa add_header ---------------------------
    #
    # ⚠️ In nginx `add_header` NON si somma fra i livelli: una `location` che
    # ne contiene anche uno solo smette di ereditare TUTTI quelli del blocco
    # `server`. Scrivendo `add_header Cache-Control ...` qui dentro, queste due
    # location servirebbero i file dell'applicazione — cioè tutto il
    # JavaScript — senza nessuna delle intestazioni di sicurezza dichiarate
    # sopra, e la cosa non darebbe nessun errore: le intestazioni
    # semplicemente non ci sarebbero.
    #
    # Per questo la cache si imposta con `expires`, che è una direttiva a sé e
    # non tocca l'ereditarietà: emette Cache-Control e Expires da sola.

    # I file con l'impronta nel nome (app-a1b2c3d4.js) non cambiano mai: se
    # cambia il contenuto cambia il nome. Si possono tenere per sempre, ed è
    # quello che rende istantaneo il secondo caricamento.
    location /assets/ {
        expires 1y;
    }

    # L'indice invece NON si mette in cache, ed è il contraccolpo della riga
    # qui sopra: è lui a dire quali file con l'impronta caricare. Messo in
    # cache, dopo un rilascio il browser continuerebbe a chiedere i file della
    # versione precedente, che non ci sono più. `expires -1` è esattamente
    # `Cache-Control: no-cache`.
    location = /index.html {
        expires -1;
    }

    # Il ripiego dell'applicazione a pagina singola: se il percorso non è un
    # file, si serve l'indice e il router del browser decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
