# ===========================================================================
# Profilo di produzione.
#
# Si attiva con SPRING_PROFILES_ACTIVE=prod, e non da qui: un file di profilo
# non si accende da se'.
#
# Questo file NON sostituisce application.properties: gli si sovrappone. Il
# file base viene caricato sempre, in ogni profilo, e qui vince soltanto
# quello che viene ridichiarato. Ogni chiave qui sotto e' percio' la smentita
# di un valore che in produzione sarebbe sbagliato o pericoloso, non una
# configurazione nuova. Quello che non si ridice resta come sta nel file base.
#
# Qui dentro non ci sono segreti e non devono entrarci: il file e' versionato.
# I valori veri arrivano dall'ambiente.
# ===========================================================================

# --- Flyway ----------------------------------------------------------------
# La riga piu' importante del file. Il file base include anche
# classpath:db/dev, cioe' R__dati_sviluppo.sql -- che sta dentro il jar, in
# BOOT-INF/classes/db/dev/. Eseguito su un database di produzione vuoto crea
# sette utenti con la stessa password, scritta in chiaro nel sorgente, fra cui
# admin@gestionale.local con il ruolo Amministratore.
#
# Da una lista di percorsi non si puo' "togliere un pezzo": si riscrive
# intera, con dentro solo le migrazioni vere.
spring.flyway.locations=classpath:db/migration

# --- Chi comanda sullo schema ----------------------------------------------
# In sviluppo e' "update", e il 9 novembre 2026 si e' visto che cosa comporta:
# la V17 aveva eliminato dichiarazione e voce_dichiarazione, e Hibernate le ha
# ricreate al primo avvio successivo, perche' le trovava ancora fra le
# entita'. Due cose che scrivono lo stesso schema e nessun arbitro.
#
# validate, non none: none ignora e tace, validate confronta le entita' con lo
# schema e rifiuta di avviare se divergono. E' il controllo che si accorge di
# un campo aggiunto senza la sua migrazione -- a terra, prima di servire dati
# sbagliati.
spring.jpa.hibernate.ddl-auto=validate

# --- Database --------------------------------------------------------------
# Variabili richieste: DB_URL, DB_USERNAME, DB_PASSWORD.
#
# Segnaposto SENZA valore di ripiego: e' questo che impedisce all'avvio di
# riuscire con le credenziali di sviluppo del file base, ed e' il motivo di
# tutto il blocco. ${VAR:ripiego} partirebbe in silenzio col ripiego.
#
# Ma attenzione a COME fallisce, che non e' come si crede: il binder di
# @ConfigurationProperties ignora i segnaposto che non sa risolvere e li passa
# avanti come testo. Provato: senza DB_USERNAME, MySQL risponde «Access denied
# for user '${DB_USERNAME}'», e senza DB_URL il messaggio e' «'url' must start
# with "jdbc"». L'avvio muore -- che e' la parte che conta -- ma il messaggio
# incolpa il database invece di dire che manca una variabile.
#
# Dirlo chiaramente e' percio' compito di chi avvia il container: in docker
# compose, ${DB_URL:?manca DB_URL} si ferma prima di avviare e lo dice. Qui si
# garantisce soltanto che non esista un ripiego silenzioso.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Sessione --------------------------------------------------------------
# Senza questo il browser allega il cookie di sessione anche su HTTP in
# chiaro: a chi sta in mezzo alla rete non serve rubare la password, gli basta
# il cookie per diventare l'utente. Il file base ne parla in un commento; qui
# diventa un meccanismo.
server.servlet.session.cookie.secure=true

# --- Dietro il reverse proxy -----------------------------------------------
# Il proxy termina il TLS e inoltra al backend in HTTP sulla rete interna:
# l'applicazione vede una richiesta non cifrata e genera redirect verso
# http://, buttando l'utente fuori dall'HTTPS. Gli header X-Forwarded-*
# dicono com'era la richiesta originale, e "framework" li fa leggere.
#
# Non e' il valore predefinito, per una buona ragione: fidarsi di quegli
# header quando davanti non c'e' nessun proxy che li riscrive permetterebbe a
# un client qualunque di mentire sullo schema e sul proprio indirizzo. Va
# messo qui, dove il proxy c'e' per certo, e non nel file base.
server.forward-headers-strategy=framework

# --- Docker Compose --------------------------------------------------------
# spring-boot-docker-compose e' una dipendenza optional e il repackage la
# tiene fuori dal jar, quindi con java -jar non partirebbe comunque. Resta
# dichiarato perche' vale per chi avvia con mvn spring-boot:run, e perche' un
# profilo di produzione deve dire le proprie intenzioni invece di appoggiarsi
# a un comportamento del plugin.
spring.docker.compose.enabled=false
