spring.application.name=backend

# --- Database ---------------------------------------------------------------
# MySQL in Docker: docker compose up -d
spring.datasource.url=jdbc:mysql://localhost:3306/gestionale
spring.datasource.username=gestionale
spring.datasource.password=gestionale_dev
spring.jpa.hibernate.ddl-auto=update
# ATTENZIONE: db/dev contiene i dati di prova. In produzione va lasciato fuori
# (vedi application-prod.properties quando ci sara').
spring.flyway.locations=classpath:db/migration,classpath:db/dev
spring.jpa.open-in-view=false

# --- Docker Compose ---------------------------------------------------------
# All'avvio Spring Boot tira su i servizi del compose e ASPETTA che il
# database sia sano prima di connettersi. Senza questo, lanciare il backend
# con MySQL ancora spento lo fa morire con "Unable to obtain connection from
# database: Communications link failure".
#
# backend e frontend nel compose stanno sotto il profilo "app", che qui non
# e' attivo: parte solo l'infrastruttura (db, phpmyadmin), quindi nessun
# container occupa la porta 8080 che serve all'applicazione locale.
spring.docker.compose.enabled=true
# Il percorso va indicato: senza, Spring Boot cerca un compose.yaml nella
# cartella di lavoro e, trovandone uno vuoto, non avvia niente e non si
# lamenta. E' relativo alla cartella di lavoro, che e' sempre backend/, sia
# con `mvnw spring-boot:run` sia con il Run di IntelliJ.
spring.docker.compose.file=../docker-compose.yml
# start-only: alla chiusura dell'applicazione i container restano su, cosi'
# il database non si spegne a ogni riavvio del backend.
spring.docker.compose.lifecycle-management=start-only

# Errori con un corpo JSON standard (RFC 9457) invece che vuoti.
spring.mvc.problemdetails.enabled=true

# --- Sessione ---------------------------------------------------------------
# L'autenticazione sta nel cookie JSESSIONID: nessun token, nessun segreto di
# firma da gestire.
#
# Il timeout si rinnova a ogni richiesta: sono minuti di INATTIVITA', come
# dice la riga sessione.timeout_minuti della tabella impostazione. Prima o poi
# va letto da li', altrimenti un amministratore lo cambiera' dall'interfaccia
# e non succedera' niente.
server.servlet.session.timeout=30m
# HttpOnly: il cookie e' invisibile a JavaScript, quindi una falla XSS nel
# frontend non permette di rubare la sessione.
server.servlet.session.cookie.http-only=true
# Strict e' la difesa dal CSRF, ed e' il motivo per cui i token CSRF sono
# disattivati in ConfigurazioneSicurezza: il browser non allega il cookie alle
# richieste che partono da un altro sito.
server.servlet.session.cookie.same-site=strict
# In produzione, dietro HTTPS: server.servlet.session.cookie.secure=true
