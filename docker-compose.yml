services:

  db:
    image: mysql:8.4
    container_name: gestionale-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestionale
      MYSQL_USER: gestionale
      MYSQL_PASSWORD: gestionale_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: Europe/Rome
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin
    container_name: gestionale-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

  backend:
    # Profilo "app": questo servizio NON parte con un semplice
    # `docker compose up`, serve `docker compose --profile app up`. Cosi'
    # `up` tira su solo db e phpmyadmin, cioe' l'infrastruttura che serve al
    # backend lanciato dall'IDE, senza litigare sulla porta 8080.
    #
    # ⚠️ QUESTO SERVIZIO E' DI SVILUPPO, e il file che usarlo per andare in
    # produzione e' un errore: non attiva SPRING_PROFILES_ACTIVE=prod, quindi
    # Flyway esegue anche db/dev e il database nasce con sette utenti di prova
    # fra cui un amministratore con la password scritta in chiaro nel
    # sorgente, e ddl-auto resta "update", cioe' Hibernate che riscrive lo
    # schema da se'. Per il server vero c'e' compose.prod.yml.
    profiles: ["app"]
    build: ./backend
    container_name: gestionale-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Niente useSSL=false, e non e' una dimenticanza: con quello la
      # connessione va in chiaro, e MySQL 8.4 autentica con
      # caching_sha2_password, che senza TLS pretende
      # allowPublicKeyRetrieval=true. Mancando, il backend muore in avvio con
      # "Public Key Retrieval is not allowed" e il container entra in crash
      # loop. Sembrava funzionare solo perche' il vecchio data directory aveva
      # l'utente creato con un plugin diverso: ricreato il database, il
      # problema e' venuto fuori.
      #
      # Lasciando decidere al driver si ottiene sslMode=PREFERRED, cioe' TLS
      # verso il certificato autofirmato del container. E' la stessa cosa che
      # fa application.properties per il backend eseguito dall'IDE, che per
      # questo si e' sempre connesso senza problemi: due configurazioni che
      # ora si comportano allo stesso modo.
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/gestionale
      - SPRING_DATASOURCE_USERNAME=gestionale
      - SPRING_DATASOURCE_PASSWORD=gestionale_dev
      # Lo stesso fuso del servizio db. Il Dockerfile lo dichiara gia', e
      # ripeterlo qui non e' ridondanza inutile: e' la riga che si vede
      # accanto a quella di MySQL, dove si nota se i due divergono. La JVM
      # senza TZ parte in UTC, e un'ora di scarto fra chi scrive
      # `creato_il` (MySQL) e chi scrive `avviata_il` (la JVM) in un
      # gestionale di ore lavorate si somma nei consuntivi.
      - TZ=Europe/Rome
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Vedi la nota sul profilo "app" nel servizio backend.
    profiles: ["app"]
    build: ./frontend
    container_name: gestionale-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend