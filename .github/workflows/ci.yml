name: ci

# Su quali rami gira, e perche' questi.
#
# `pull_request` e' la riga che conta per il flusso di lavoro: il workflow
# parte sul MERGE DI PROVA fra la PR e il ramo di destinazione, cioe' su cio'
# che il ramo diventerebbe accettando la PR - non sul ramo sorgente da solo.
# E' la differenza fra «il mio ramo builda» e «builda anche dopo averlo
# unito», che sono due domande diverse quando intanto la destinazione e'
# andata avanti.
#
# `deploy` e' la destinazione da proteggere: ci si arriva solo per PR da
# `develop`, e il verde di questi lavori e' cio' che si guarda prima di
# accettarla. `develop` c'e' anche lui, perche' scoprire un test rotto quando
# si apre la PR verso deploy e' tardi: li' si vorrebbe solo confermare.
#
# ⚠️ Il verde del workflow NON impedisce da se' di unire una PR rossa: GitHub
# lo consente finche' il controllo non e' dichiarato obbligatorio nelle
# impostazioni del repository (Settings > Branches > branch protection su
# `deploy`). Senza quel passo questa pipeline informa, non protegge.
on:
  push:
    branches: ["main", "master", "develop", "deploy"]
  pull_request:
    branches: ["main", "master", "develop", "deploy"]

  # Per lanciarlo a mano da Actions su un ramo qualunque, senza aprire una PR
  # per forza.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Tre test (BackendApplicationTests, SessioniEOreTest,
    # UtenteRepositoryTest) parlano con MySQL vero, e non per pigrizia: le
    # colonne generate di sessione_task, la vista permesso_effettivo e le
    # query native di TaskRepository sono scritte in SQL di MySQL, quindi un
    # database finto non le proverebbe. Stessa immagine e stesse credenziali
    # del docker-compose di sviluppo: se cambiano la', cambiano anche qui.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gestionale
          MYSQL_USER: gestionale
          MYSQL_PASSWORD: gestionale_dev
          MYSQL_ROOT_PASSWORD: root_dev
          TZ: Europe/Rome
        ports:
          - 3306:3306
        # Senza l'attesa sulla salute, Maven parte mentre MySQL sta ancora
        # inizializzando e i test muoiono con "Communications link failure".
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # Il database della corsa e' vuoto: Flyway ci costruisce sopra tutte le
      # migrazioni di db/migration piu' il seed ripetibile di db/dev, che e' la
      # stessa fixture su cui girano i test in locale. Niente dump da portarsi
      # dietro.
      #
      # Il numero dell'ultima migrazione non si scrive qui: era "V1..V17" e
      # intanto siamo alla V21, cioe' un commento che diceva il falso. Quante
      # sono lo dice la cartella.
      #
      # ⚠️ Che il database sia **vuoto** non e' un dettaglio: e' la ragione per
      # cui UtenteRepositoryTest passa qui e puo' fallire in locale. Quel test
      # verifica che l'utenza chiusa di prova non abbia permessi, e il seed la
      # crea chiusa; su un database di sviluppo in cui qualcuno l'ha riattivata
      # a mano, il seed ripetibile non la richiude — Flyway lo rilancia solo
      # quando cambia il file, non quando cambiano i dati.
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/gestionale
      SPRING_DATASOURCE_USERNAME: gestionale
      SPRING_DATASOURCE_PASSWORD: gestionale_dev
      # spring-boot-docker-compose e' una dipendenza di scope runtime, quindi
      # sta anche nel classpath dei test: senza questo cercherebbe
      # ../docker-compose.yml e proverebbe ad avviare un SECONDO MySQL dentro
      # il runner, che qui non serve e non c'e'.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Coincide con <java.version> del pom: cambiarla qui senza
          # cambiarla la' fa fallire la compilazione.
          java-version: '25'
          cache: maven

      - name: build and test with maven
        # package, non compile. Due ragioni: e' package a eseguire i test
        # (compile si fermava prima, quindi il nome di questo passo era una
        # promessa non mantenuta), ed e' package a produrre il jar che il
        # passo dopo carica. Con compile il target/ restava senza jar e
        # upload-artifact moriva con "no files were found".
        run: ./mvnw -B --no-transfer-progress package
        working-directory: backend

      - name: upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          # *.jar prende solo il jar eseguibile: il .jar.original che il
          # repackage lascia accanto non corrisponde al glob.
          path: backend/target/*.jar
          # Se un giorno il jar non c'e' piu', il workflow deve rompersi qui
          # e dirlo, non caricare un artefatto vuoto e passare verde.
          if-no-files-found: error

  # ===========================================================================
  # Il profilo di produzione, provato qui e non in produzione.
  #
  # `spring.jpa.hibernate.ddl-auto=validate` e' il controllo piu' importante di
  # application-prod.properties: confronta le entita' con lo schema e rifiuta
  # di avviarsi se divergono. Ma il lavoro "build" qui sopra gira senza
  # profilo, cioe' con ddl-auto=update, che una divergenza la sistema da se'
  # in silenzio — quindi la PRIMA esecuzione di quel controllo sarebbe stata
  # in produzione, su un container che non parte e un rilascio da disfare.
  #
  # Questo lavoro fa partire l'applicazione come in produzione, su un database
  # migrato con le SOLE migrazioni versionate (niente db/dev), e dimostra due
  # cose in un colpo:
  #
  #   1. entita' e schema concordano;
  #   2. su un database senza nessun utente, l'amministratore iniziale viene
  #      creato e ci si riesce ad autenticare. E' il percorso del primo avvio
  #      su un server nuovo, che altrimenti nessuno prova finche' non tocca
  #      provarlo per davvero.
  # ===========================================================================
  profilo-produzione:
    needs: build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gestionale
          MYSQL_USER: gestionale
          MYSQL_PASSWORD: prova_ci
          MYSQL_ROOT_PASSWORD: root_ci
          TZ: Europe/Rome
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./jar

      # In produzione le due utenze nascono da db-init/10-utenze.sh, montato
      # su /docker-entrypoint-initdb.d. Qui non si puo': i `services:` di
      # GitHub Actions non accettano `volumes:`. Quindi si fa lo stesso lavoro
      # a mano, con gli stessi GRANT - e se i due elenchi divergono, questo
      # job se ne accorge prima del server.
      #
      # Non e' solo per far passare il job: e' il controllo che l'applicazione
      # riesca davvero a partire, migrare e fare login con l'utenza
      # applicativa ridotta ai soli privilegi DML. Senza questo, la
      # configurazione che gira in produzione sarebbe l'unica mai provata.
      - name: separa le utenze del database
        run: |
          mysql -h 127.0.0.1 -uroot -proot_ci <<'SQL'
          REVOKE IF EXISTS ALL PRIVILEGES ON `gestionale`.* FROM 'gestionale'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `gestionale`.* TO 'gestionale'@'%';

          CREATE USER IF NOT EXISTS 'gestionale_flyway'@'%' IDENTIFIED BY 'flyway_ci';
          GRANT SELECT, INSERT, UPDATE, DELETE,
                CREATE, DROP, ALTER, INDEX, REFERENCES,
                CREATE VIEW, SHOW VIEW
              ON `gestionale`.* TO 'gestionale_flyway'@'%';

          FLUSH PRIVILEGES;
          SQL
          echo "--- privilegi dell'utenza applicativa ---"
          mysql -h 127.0.0.1 -uroot -proot_ci -N -e "SHOW GRANTS FOR 'gestionale'@'%'"

      - name: avvia il backend con il profilo prod
        env:
          SPRING_PROFILES_ACTIVE: prod
          # I nomi delle variabili sono quelli veri, non quelli comodi:
          # application-prod.properties legge ${DB_URL}, ${DB_USERNAME},
          # ${DB_PASSWORD} e non spring.datasource.*, e se un giorno
          # cambiassero questo lavoro deve rompersi.
          DB_URL: jdbc:mysql://127.0.0.1:3306/gestionale
          DB_USERNAME: gestionale
          DB_PASSWORD: prova_ci
          # L'utenza con cui gira Flyway, l'unica che puo' cambiare lo schema.
          # In application-prod.properties non hanno valore di ripiego: se
          # mancano, l'avvio si ferma dicendo quale - ed e' voluto, perche' un
          # ripiego sull'utenza applicativa disattiverebbe la separazione
          # senza dirlo.
          FLYWAY_USERNAME: gestionale_flyway
          FLYWAY_PASSWORD: flyway_ci
          GESTIONALE_AMMINISTRATOREINIZIALE_EMAIL: prova@ci.local
          GESTIONALE_AMMINISTRATOREINIZIALE_PASSWORD: ProvaCi1!
          # Il profilo prod lo mette a true per il cookie Secure, ma qui si
          # parla in HTTP su localhost: con Secure il cookie non tornerebbe
          # indietro e il controllo sulla sessione piu' sotto fallirebbe per
          # il motivo sbagliato. E' l'unica riga del profilo che si smentisce,
          # ed e' esattamente la decisione che l'installazione vera deve
          # prendere su HTTPS.
          SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
        run: |
          java -jar ./jar/*.jar > backend.log 2>&1 &
          echo $! > backend.pid

      - name: aspetta che risponda
        run: |
          for tentativo in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness > /dev/null; then
              echo "Il backend risponde."
              exit 0
            fi
            sleep 2
          done
          echo "Il backend non è partito entro due minuti."
          exit 1

      - name: l'amministratore iniziale riesce ad accedere
        run: |
          stato=$(curl -s -o risposta.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/autenticazione/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"prova@ci.local","password":"ProvaCi1!"}')
          if [ "$stato" != "200" ]; then
            echo "Login fallito con stato $stato:"
            cat risposta.json
            exit 1
          fi
          echo "Accesso riuscito con l'amministratore creato all'avvio."

      - name: il log del backend
        # Anche quando i passi precedenti falliscono: senza, un avvio non
        # riuscito lascerebbe solo «exit 1» e nessun modo di sapere perche'.
        if: always()
        run: cat backend.log

  frontend:
    runs-on: ubuntu-latest
    # Non dipende da "build": il frontend non ha niente a che vedere con il
    # jar, e farlo aspettare vorrebbe dire scoprire un errore di tipo solo
    # dopo i test del backend.
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # 22 e non 20: Vite 8 pretende Node 20.19+ o 22+, come il Dockerfile.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        # `ci` e non `install`: installa esattamente le versioni del lockfile e
        # fallisce se package.json e lockfile non concordano.
        run: npm ci
        working-directory: frontend

      - name: lint
        run: npm run lint
        working-directory: frontend

      - name: build
        # Lo script e' `tsc -b && vite build`, quindi questo passo controlla
        # anche i tipi. Prima non girava niente di tutto cio' sul CI: il
        # frontend non era nel workflow per niente, e un errore di tipo si
        # scopriva al primo `npm run build` di qualcuno.
        run: npm run build
        working-directory: frontend

  # ===========================================================================
  # Lo stack di produzione vero, costruito e avviato come sul server.
  #
  # Gli altri lavori provano il CODICE: Maven compila ed esegue i test, npm
  # controlla i tipi, e «profilo-produzione» fa partire il jar con il profilo
  # prod. Nessuno di loro prova il RILASCIO, che e' un'altra cosa e si rompe
  # per altri motivi:
  #
  #   * i due Dockerfile. Un `mvnw package` riuscito non dice che l'immagine
  #     si costruisce: il build dentro il container parte da un contesto
  #     diverso, con un'altra JDK e senza la cache locale.
  #   * compose.prod.yml. Le variabili che passa, i `depends_on`, gli
  #     healthcheck, il `${VAR:?}` che ferma tutto se manca una chiave del
  #     .env: niente di questo esiste per gli altri lavori.
  #   * db-init/10-utenze.sh, che crea le due utenze del database. Il lavoro
  #     «profilo-produzione» rifa' quei GRANT a mano, perche' i `services:` di
  #     Actions non accettano `volumes:` - quindi prova i privilegi, ma NON lo
  #     script che li concede. Qui lo script gira per davvero, montato dal
  #     compose come sul server.
  #   * nginx del frontend e il suo proxy verso il backend: l'unica prova che
  #     la pagina e l'API si parlino attraverso la porta pubblicata.
  #
  # E' il lavoro piu' lento (due immagini da costruire) e per questo gira solo
  # dove serve: sulle PR verso `deploy`, sui push a `deploy`, e a mano. Sul
  # ramo di sviluppo rallenterebbe ogni giro per rispondere a una domanda che
  # si fa una volta per rilascio.
  # ===========================================================================
  stack-di-produzione:
    runs-on: ubuntu-latest
    if: github.base_ref == 'deploy' || github.ref == 'refs/heads/deploy' || github.event_name == 'workflow_dispatch'

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      # Prima di costruire qualunque cosa: la cartella che il compose monta su
      # /docker-entrypoint-initdb.d deve esistere NEL REPOSITORY.
      #
      # Non e' una verifica di cortesia. Se `db-init/` non e' versionata, il
      # checkout non la crea, Docker monta al suo posto una cartella VUOTA
      # senza lamentarsi, le due utenze non nascono e il backend muore molto
      # piu' tardi con «Access denied for user 'gestionale_flyway'» - un
      # messaggio che manda a cercare la password sbagliata nel posto
      # sbagliato. Meglio fermarsi qui, dicendo che cosa manca.
      - name: db-init deve essere versionata
        run: |
          if [ ! -f db-init/10-utenze.sh ]; then
            echo "::error::db-init/10-utenze.sh non c'e' nel repository."
            echo "La cartella e' montata da compose.prod.yml su /docker-entrypoint-initdb.d"
            echo "e crea le utenze del database. Se esiste solo in locale va aggiunta:"
            echo "  git add db-init/"
            exit 1
          fi
          ls -l db-init/

      # Il .env che compose.prod.yml pretende accanto a se'. Valori di prova,
      # non segreti: questo database nasce e muore dentro il runner. La
      # password dell'amministratore rispetta le regole del gestionale
      # (almeno 8 caratteri, una cifra, un carattere non alfanumerico):
      # altrimenti l'utente non viene creato, il container resta sano, e il
      # login piu' sotto fallirebbe senza che il motivo sia evidente.
      - name: il file .env della prova
        run: |
          cat > .env <<'FINE'
          DB_PASSWORD=prova_ci_db
          MYSQL_ROOT_PASSWORD=prova_ci_root
          FLYWAY_PASSWORD=prova_ci_flyway
          ADMIN_EMAIL=prova@ci.local
          ADMIN_PASSWORD=ProvaCi1!
          FINE
          echo "chiavi scritte, senza i valori:"
          grep -oE '^[A-Z_]+' .env

      - name: costruisci le immagini
        run: docker compose -f compose.prod.yml build

      # `--wait` aspetta che ogni servizio con un healthcheck sia *healthy*,
      # non solo avviato: senza, il passo dopo partirebbe mentre Flyway sta
      # ancora migrando. Il timeout e' generoso perche' al primo avvio MySQL
      # inizializza il datadir ed esegue db-init, e il backend applica tutte
      # le migrazioni su un database vuoto.
      - name: avvia lo stack
        run: docker compose -f compose.prod.yml up -d --wait --wait-timeout 300

      - name: lo stato dei servizi
        run: docker compose -f compose.prod.yml ps

      # Da qui si interroga il sistema dalla porta pubblicata, come lo
      # vedrebbe un browser sulla rete aziendale: attraverso nginx, non
      # parlando al backend.
      - name: la pagina si apre
        run: |
          stato=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)
          if [ "$stato" != "200" ]; then
            echo "::error::il frontend risponde $stato"
            exit 1
          fi
          echo "Il frontend risponde 200."

      - name: si entra con l'amministratore iniziale
        run: |
          stato=$(curl -s -o risposta.json -w '%{http_code}' -c biscotti.txt \
            -X POST http://127.0.0.1/api/autenticazione/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"prova@ci.local","password":"ProvaCi1!"}')
          if [ "$stato" != "200" ]; then
            echo "::error::login fallito con stato $stato"
            cat risposta.json
            exit 1
          fi
          # Il login risponde 200 anche se il cookie non torna indietro: la
          # prova vera e' una SECONDA richiesta che si regge su quella
          # sessione. Senza, un cookie Secure servito su HTTP passerebbe
          # inosservato - ogni chiamata anonima, e il login verde.
          stato=$(curl -s -o /dev/null -w '%{http_code}' -b biscotti.txt \
            http://127.0.0.1/api/autenticazione/io)
          if [ "$stato" != "200" ]; then
            echo "::error::la sessione non regge: /io risponde $stato"
            exit 1
          fi
          echo "Accesso riuscito, e la sessione regge la richiesta successiva."

      # Tre cose che distinguono un rilascio di produzione da uno di
      # sviluppo, e che un avvio riuscito NON garantisce: si vedono solo
      # guardando. Il lavoro non si ferma al primo errore, cosi' un giro
      # rosso dice quante e quali invarianti sono cadute, non solo la prima.
      - name: le invarianti della produzione
        run: |
          esito=0

          # 1. Nessun dato di prova. Senza il profilo prod, Flyway eseguirebbe
          # anche db/dev: sette utenti con la stessa password in chiaro nel
          # sorgente, uno di loro amministratore. Su un database appena nato
          # l'unico utente deve essere quello creato da ADMIN_EMAIL.
          utenti=$(docker compose -f compose.prod.yml exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT COUNT(*) FROM gestionale.utente"' | tr -d '[:space:]')
          if [ "$utenti" = "1" ]; then
            echo "OK - un solo utente: i dati di sviluppo non sono entrati"
          else
            echo "::error::la tabella utente ha $utenti righe invece di 1: db/dev e' entrato in produzione"
            esito=1
          fi

          # 2. La documentazione dell'API spenta: e' l'elenco di tutte le
          # rotte, dei corpi accettati e dei codici d'errore, cioe' la mappa
          # di come attaccare il gestionale. Si interroga il backend
          # DALL'INTERNO, perche' da fuori nginx risponde 200 con la pagina
          # dell'applicazione a qualunque percorso sconosciuto - e quel 200
          # sembrerebbe un api-docs acceso.
          stato=$(docker compose -f compose.prod.yml exec -T backend curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v3/api-docs)
          if [ "$stato" = "404" ]; then
            echo "OK - /v3/api-docs spento (404)"
          else
            echo "::error::/v3/api-docs risponde $stato: la documentazione dell'API e' esposta"
            esito=1
          fi

          # 3. Il database non raggiungibile da fuori. In tutto il sistema
          # deve esserci UNA porta pubblicata, quella del frontend: una 3306
          # esposta la offrirebbe a tutta la rete aziendale.
          if docker compose -f compose.prod.yml ps --format '{{.Service}} {{.Ports}}' | grep -E '^db .*0\.0\.0\.0'; then
            echo "::error::il servizio db pubblica una porta sull'host"
            esito=1
          else
            echo "OK - il database non pubblica porte sull'host"
          fi

          exit $esito

      # Quando qualcosa qui sopra fallisce, questo e' l'unico posto dove si
      # legge il perche': i log restano dentro i container, e il passo
      # successivo li porta via.
      - name: i log dello stack
        if: always()
        run: docker compose -f compose.prod.yml logs --no-color --tail 200

      - name: smonta tutto
        if: always()
        # `-v` porta via anche il volume del database. Il runner e' usa e
        # getta, ma dipendere da quello e' il modo in cui una prova che deve
        # partire da zero finisce per trovare i dati di un'altra corsa.
        run: docker compose -f compose.prod.yml down -v
